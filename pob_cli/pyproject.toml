[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pob-cli"
version = "0.2.0"
description = "Path of Building headless daemon and high-SNR CLI for agents"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "tabulate>=0.9.0",
]

[project.scripts]
pob = "pob_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
