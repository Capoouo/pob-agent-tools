name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pob_cli/pyproject.toml"

      - name: Install package and dev tools (non-editable)
        run: |
          python -m pip install --upgrade pip
          pip install "./pob_cli[dev]"

      - name: Run unit tests (offline mode)
        env:
          POB_OFFLINE: "1"
        run: |
          python -m pytest pob_cli/tests -v

      - name: Verify installed CLI entry point
        run: |
          pob --version
          pob --help | Out-Null
          pob _daemon --help | Out-Null

      - name: Build Python wheel and sdist
        run: |
          python -m build pob_cli --outdir dist-py
          Get-ChildItem dist-py

      - name: Build standalone Windows x64 binary (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean pob_cli/packaging/pob.spec

      - name: Smoke-test standalone pob.exe (including frozen _daemon spawn)
        run: |
          $exe = Join-Path (Resolve-Path "dist/pob") "pob.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "pob.exe --version failed" }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe --help failed" }
          & $exe _daemon --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe _daemon --help failed" }
          & $exe bench list --slot gloves --limit 3 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe bench list failed (missing bundled bench_costs.json?)" }
          & $exe bench suggest --slot gloves --stat "to Cold Resistance" --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe bench suggest failed" }
          & $exe trade convert --text "Rarity: RARE`nDoom Hand`nSlink Gloves`nImplicits: 0`n+42% to Fire Resistance" --to cold --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pob.exe trade convert failed" }

          # Verify frozen daemon subprocess spawns and fast-fails cleanly when no engine exists
          $rt = Join-Path $env:RUNNER_TEMP "pob-smoke-rt"
          New-Item -ItemType Directory -Path $rt -Force | Out-Null
          $env:POB_RUNTIME_DIR = $rt
          $env:POB_LEGACY_DIR = ""
          $env:POB_OFFLINE = "1"
          $out = & $exe status 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 1) {
            throw "Expected exit code 1 for bootstrap_missing, got $code. Output: $out"
          }
          if ($out -notmatch "bootstrap") {
            throw "Expected bootstrap guidance in stderr. Output: $out"
          }
          Write-Host "Frozen pob.exe smoke test passed."
          exit 0

  test-posix-native:
    name: POSIX Native (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS-arm64
            tag: darwin-arm64
          - os: ubuntu-latest
            label: Linux-x64
            tag: linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pob_cli/pyproject.toml"

      - name: Install package and dev tools
        run: |
          python3 -m pip install --upgrade pip
          pip install "./pob_cli[dev]"

      - name: Run unit tests (offline mode)
        env:
          POB_OFFLINE: "1"
        run: |
          python3 -m pytest pob_cli/tests -v

      - name: Build native POSIX LuaJIT + lua-utf8 runtime
        run: |
          chmod +x pob_cli/packaging/build_posix_runtime.sh
          ./pob_cli/packaging/build_posix_runtime.sh runtime-dist
          tar -czf "pob-runtime-${{ matrix.tag }}.tar.gz" -C runtime-dist bin
          ls -lh "pob-runtime-${{ matrix.tag }}.tar.gz"

      - name: Upload prebuilt POSIX runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: pob-runtime-${{ matrix.tag }}
          path: pob-runtime-${{ matrix.tag }}.tar.gz

      - name: End-to-end live PoB bootstrap & headless CLI verification
        env:
          POB_RUNTIME_DIR: ${{ runner.temp }}/pob-e2e-rt
          POB_LEGACY_DIR: ""
        run: |
          trap 'echo "=== daemon.log ==="; cat "$POB_RUNTIME_DIR/daemon.log" 2>/dev/null || true' ERR
          mkdir -p "$POB_RUNTIME_DIR/engine"
          cp -R runtime-dist/bin "$POB_RUNTIME_DIR/engine/bin"

          # Live bootstrap: fetches official PoB PoE1/ + PobTools Data/bridge/bridge.lua and passes gate_result!
          pob bootstrap --no-zh --json

          # Load a minimal PoB XML build with a Fireball skill group to verify full calculation, Inflate/Deflate, mutation, and matrix
          cat > "$RUNNER_TEMP/test_build.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <PathOfBuilding>
            <Build level="90" targetVersion="3_0" className="Witch" ascendClassName="Elementalist" mainSocketGroup="1" viewMode="SKILLS"/>
            <Tree activeSpec="1"><Spec title="Default" treeVersion="3_25" classId="3" ascendClassId="2" nodes="54447"/></Tree>
            <Skills activeSkillSet="1">
              <SkillSet id="1">
                <Skill mainActiveSkill="1" enabled="true" label="Main">
                  <Gem nameSpec="Fireball" level="20" quality="20" enabled="true"/>
                </Skill>
              </SkillSet>
            </Skills>
            <Items activeItemSet="1"><ItemSet id="1"/></Items>
            <Config activeConfigSet="1"><ConfigSet id="1"/></Config>
          </PathOfBuilding>
          EOF

          # Verify persistent daemon auto-start, build load, calculation, mutation, Inflate/Deflate roundtrip, matrix, and clean shutdown
          pob status --json
          pob load "@$RUNNER_TEMP/test_build.xml" --json
          pob summary --json
          pob audit --json
          pob skills --json
          pob items --json
          pob tree --json
          pob tree set-class Witch Necromancer --apply --json
          pob skill add --group main --gem "Added Fire Damage Support" --level 20 --quality 20 --apply --json
          pob summary --json
          CODE="$(pob export-code --json | python3 -c 'import sys, json; print(json.load(sys.stdin)["code"])')"
          test -n "$CODE"
          pob load "$CODE" --json
          pob matrix Original Pinnacle --json
          pob bench list --slot gloves --limit 3 --json
          pob trade convert --text $'Rarity: RARE\nDoom Hand\nSlink Gloves\nImplicits: 0\n+42% to Fire Resistance' --to cold --json
          pob stop --json
